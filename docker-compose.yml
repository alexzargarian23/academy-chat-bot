
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: concierge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: concierge_db
      POSTGRES_USER: academy_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
